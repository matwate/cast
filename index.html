<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>cast - Remote for your slides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/spot.css" />
    <!-- Hyperscript -->
    <script src="/assets/vendor/_hyperscript.min.js"></script>
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }
      .drop-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        min-height: 224px;
        cursor: pointer;
        text-align: center;
      }
      .drop-zone.dragover {
        background: var(--shade);
        color: var(--on-shade);
      }
      .drop-zone.dragover .spot-label {
        color: var(--on-shade);
      }
      .drop-zone.invalid::before,
      .drop-zone.invalid::after,
      .drop-zone.invalid > .spot-frame__in::before,
      .drop-zone.invalid > .spot-frame__in::after {
        border-color: var(--ink);
        width: 24px;
        height: 24px;
      }
      .drop-zone.invalid::before { border-top-width: 2px; border-left-width: 2px; }
      .drop-zone.invalid::after { border-top-width: 2px; border-right-width: 2px; }
      .drop-zone.invalid > .spot-frame__in::before { border-bottom-width: 2px; border-left-width: 2px; }
      .drop-zone.invalid > .spot-frame__in::after { border-bottom-width: 2px; border-right-width: 2px; }
      .file-name {
        font-weight: 600;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header style="display: flex; flex-direction: column; gap: var(--space-4)">
        <span class="spot-label">Cast</span>
        <h1 class="spot-hero">Remote<br />for your<br />slides.</h1>
        <p class="lead">
          Upload a PDF or PPTX, then drive it from your phone.
        </p>
      </header>

      <form action="/convert" method="POST" enctype="multipart/form-data">
        <section class="spot-section">
          <label class="spot-label" for="username">Username</label>
          <input
            name="username"
            _="on change  if my.value is empty add .invalid else remove .invalid end on input if my.value is empty add .invalid else remove .invalid end"
            class="field"
            id="username"
            placeholder="e.g. snowflake"
            type="text"
          />
          <p class="meta error-note">* Enter a username</p>
        </section>

        <section class="spot-section">
          <span class="spot-label">Upload File</span>
          <div class="spot-frame drop-zone" id="dropZone">
            <div class="spot-frame__in"></div>
            <p class="lead">Drop your file here</p>
            <p class="meta">or click to browse · PDF, PPTX</p>
          </div>
          <p class="meta error-note">* Choose a file</p>
          <input
            name="data"
            hidden
            id="fileInput"
            type="file"
            accept=".pptx, .pdf, application/pdf, application/vnd.openxmlformats-officedocument.presentationml.presentation"
          />
        </section>

        <div>
          <button
            _="on click
              set usernameInput to #username
              set fileInput to #fileInput
              if usernameInput.value is empty
                add .invalid to usernameInput
              end
              if fileInput.files.length is 0
                add .invalid to #dropZone
              end
              if usernameInput.value is empty or fileInput.files.length is 0
                halt the event
              end"
            class="spot-button spot-button--accent spot-button--block"
            type="submit"
          >
            Send File →
          </button>
        </div>
      </form>

      <footer>
        <p class="meta">Simple. Private. Fast.</p>
      </footer>
    </main>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");

      // Trigger file input on click
      dropZone.addEventListener("click", () => fileInput.click());

      ["dragenter", "dragover"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add("dragover");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");
        });
      });

      function showFileLoaded(filename) {
        dropZone.classList.remove("invalid");
        dropZone.innerHTML = `
          <div class="spot-frame__in"></div>
          <span class="spot-label">File Loaded</span>
          <p class="lead file-name"></p>
          <button type="button" class="spot-button">Change File</button>
        `;
        dropZone.querySelector(".file-name").textContent = filename;
        dropZone.querySelector("button").addEventListener("click", (e) => {
          e.stopPropagation();
          fileInput.click();
        });
      }

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) {
          showFileLoaded(e.target.files[0].name);
        }
      });

      dropZone.addEventListener("drop", (e) => {
        const files = e.dataTransfer.files;
        if (files.length) {
          fileInput.files = files;
          showFileLoaded(files[0].name);
        }
      });
    </script>
  </body>
</html>
