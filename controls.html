<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cast - Mobile Remote Controls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/spot.css" />
    <style>
      .page {
        max-width: 480px;
        min-height: 100vh;
        gap: var(--space-4);
        padding-top: var(--space-4);
        padding-bottom: var(--space-4);
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
      }
      .status[data-status="connecting"] .dot {
        animation: blink 1s steps(2, start) infinite;
      }
      .status[data-status="connected"] .dot {
        background: var(--ink);
      }
      .status[data-status="disconnected"] .dot,
      .status[data-status="error"] .dot {
        background: var(--accent);
        border-color: var(--accent);
      }
      @keyframes blink {
        to { visibility: hidden; }
      }
      .counter {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
      }
      .counter__total {
        font-size: 22px;
        line-height: 30px;
        font-weight: 600;
      }
      .remote {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      #nextBtn {
        flex-grow: 1;
        min-height: 160px;
        font-size: 22px;
        line-height: 30px;
      }
      #prevBtn {
        min-height: 96px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1 class="spot-hero spot-hero--3">cast</h1>
        <span class="status" id="connectionStatus" data-status="connecting">
          <span class="dot"></span>
          <span class="spot-label" id="statusText">Connecting</span>
        </span>
      </header>

      <div class="spot-frame">
        <div class="spot-frame__in"></div>
        <span class="spot-label">Slide</span>
        <p class="counter">
          <span id="currentSlide" class="spot-hero spot-hero--2">1</span>
          <span class="counter__total">/ <span id="totalSlides">?</span></span>
        </p>
      </div>

      <section class="remote">
        <button
          id="nextBtn"
          class="spot-button spot-button--solid spot-button--block"
          type="button"
        >
          Next →
        </button>
        <button
          id="prevBtn"
          class="spot-button spot-button--block"
          type="button"
        >
          ← Previous
        </button>
      </section>

      <footer style="display: flex; flex-direction: column; gap: var(--space-3)">
        <button
          class="spot-button spot-button--block"
          type="button"
          id="stopBtn"
        >
          ■ Stop Presentation
        </button>
        <p class="meta">Connected as {{USERNAME}}</p>
      </footer>
    </main>
    <script>
      (function () {
        const castCode = "{{CAST_CODE}}";
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const WS_URL =
          protocol + "cast.matwa.dev/ws/?cast_code=" + castCode + "&type=controller";

        const statusLabels = {
          connecting: "Connecting",
          connected: "Connected",
          disconnected: "Disconnected",
          error: "Connection Error",
        };

        let socket = null;
        let currentSlide = 1;
        let totalSlides = 0;

        function updateConnectionStatus(status) {
          document.getElementById("connectionStatus").dataset.status = status;
          document.getElementById("statusText").textContent = statusLabels[status];
          const disabled = status !== "connected";
          document.getElementById("nextBtn").disabled = disabled;
          document.getElementById("prevBtn").disabled = disabled;
        }

        function connect() {
          updateConnectionStatus("connecting");
          socket = new WebSocket(WS_URL);

          socket.onopen = () => {
            console.log("Connected to control server");
            updateConnectionStatus("connected");
          };

          socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "state") {
              currentSlide = data.indexh + 1;
              totalSlides = data.total;
              updateSlideDisplay();
            }
          };

          socket.onclose = () => {
            console.log("Disconnected, reconnecting in 3s...");
            updateConnectionStatus("disconnected");
            setTimeout(connect, 3000);
          };

          socket.onerror = (error) => {
            console.error("WebSocket error:", error);
            updateConnectionStatus("error");
          };
        }

        function updateSlideDisplay() {
          document.getElementById("currentSlide").textContent = currentSlide;
          document.getElementById("totalSlides").textContent = totalSlides;
        }

        function sendCommand(action) {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "cmd", action }));
          }
        }

        document
          .getElementById("nextBtn")
          .addEventListener("click", () => sendCommand("next"));
        document
          .getElementById("prevBtn")
          .addEventListener("click", () => sendCommand("prev"));
        document.getElementById("stopBtn").addEventListener("click", () => {
          if (confirm("Stop presentation?")) {
            socket.close();
            window.location.href = "/";
          }
        });

        connect();
      })();
    </script>
  </body>
</html>
