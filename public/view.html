<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>cast - connection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/spot.css" />
    <style>
      .page {
        max-width: 1024px;
      }
      .connect {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-5);
        align-items: center;
      }
      .connect__text {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .qr {
        display: block;
        width: 256px;
        height: 256px;
        padding: var(--space-3);
        background: var(--paper);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }
      @media (max-width: 768px) {
        .connect {
          grid-template-columns: minmax(0, 1fr);
        }
        .connect .spot-frame {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <span class="spot-label">Cast</span>

      <div class="connect">
        <section class="spot-section connect__text">
          <span class="spot-label" style="margin-bottom: 0">Cast Code</span>
          <h1 class="spot-hero" style="overflow-wrap: anywhere">{{CAST_CODE}}</h1>
          <p class="lead">Scan or enter the code to connect your remote.</p>
          <div class="actions">
            <button
              onclick="window.open('{{PRESENTATION_URL}}', '_blank')"
              class="spot-button spot-button--accent"
              type="button"
            >
              Go to Slides →
            </button>
            <button
              onclick="window.open('{{CONTROLS_URL}}', '_blank')"
              class="spot-button spot-button--solid"
              type="button"
            >
              Go to Controls →
            </button>
          </div>
        </section>

        <div class="spot-frame">
          <div class="spot-frame__in"></div>
          <img
            class="qr"
            alt="QR code for connecting the remote"
            src="{{QR_URL}}"
          />
        </div>
      </div>
    </main>
  </body>
</html>
